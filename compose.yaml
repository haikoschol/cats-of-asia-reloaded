services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgconsole:
    image: pgplex/pgconsole:latest
    ports:
      - "127.0.0.1:3001:9876"
    volumes:
      - ./pgconsole.toml:/etc/pgconsole.toml:ro
    depends_on:
      - db

volumes:
  postgres-data:
