name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go and JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull and verify the matching CI image
        id: ci-image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
            && image=$(bash devenv/pull-ci-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}-ci"); then
            printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          else
            echo 'No usable CI image. Running tests with devenv.'
          fi

      - name: Cache Go modules and build outputs
        if: steps.ci-image.outputs.image != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coa-go-cache
          key: go-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-image.outputs.image }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-image.outputs.image }}-

      - name: Run tests in the verified CI image
        if: steps.ci-image.outputs.image != ''
        env:
          CI_IMAGE: ${{ steps.ci-image.outputs.image }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/coa-go-cache"
          mkdir -p "$cache_dir"
          runner_owner="$(id -u):$(id -g)"
          image_owner=$(docker image inspect --format '{{.Config.User}}' "$CI_IMAGE")
          # The image runs as a non-root user with a different UID from the runner.
          trap 'sudo chown -hR -- "$runner_owner" "$cache_dir"' EXIT
          sudo chown -hR -- "$image_owner" "$cache_dir"

          docker run --rm \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$cache_dir,target=/go-cache" \
            --env GOMODCACHE=/go-cache/mod \
            --env GOCACHE=/go-cache/build \
            "$CI_IMAGE"

      - name: Set up Nix for the fallback
        if: steps.ci-image.outputs.image == ''
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Enable the devenv binary cache
        if: steps.ci-image.outputs.image == ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true

      - name: Run tests with devenv
        if: steps.ci-image.outputs.image == ''
        run: nix run "$(cat devenv/cli-ref)" -- --no-tui --profile ci tasks run app:test --show-output

  release:
    name: Linux release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Enable the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true

      - name: Build Linux binary and checksum
        id: build
        shell: bash
        run: |
          set -euo pipefail
          nix run "$(cat devenv/cli-ref)" -- --no-tui tasks run app:release --show-output
          echo "version=coa-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${VERSION}-linux-amd64"

          if RELEASE_INFO=$(gh release view "$VERSION" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv'); then
            read -r IS_DRAFT TARGET_COMMIT <<< "$RELEASE_INFO"
            if [[ "$TARGET_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Release version already refers to a different commit." >&2
              exit 1
            fi
            if [[ "$IS_DRAFT" == 'false' ]]; then
              echo "Release already published; leaving its files unchanged."
              exit 0
            fi
          else
            gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
              --title "$VERSION" --notes "Linux amd64 binary with embedded web assets. Commit: $GITHUB_SHA"
          fi

          gh release upload "$VERSION" "dist/$BINARY" "dist/$BINARY.sha256" --clobber
          gh release edit "$VERSION" --draft=false --latest=false
