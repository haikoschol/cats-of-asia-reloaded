name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVENV_REF: github:NixOS/nixpkgs/1c872b8c508bbbfebc1b0b74777ff391ce0a574c#devenv

jobs:
  test:
    name: Go and JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Enable the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true

      - name: Run tests with an isolated database
        run: nix run "$DEVENV_REF" -- --no-tui tasks run app:test --show-output

  release:
    name: Linux release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Enable the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true

      - name: Build Linux binary and checksum
        id: build
        shell: bash
        run: |
          set -euo pipefail
          nix run "$DEVENV_REF" -- --no-tui tasks run app:release --show-output
          echo "version=coa-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${VERSION}-linux-amd64"

          if RELEASE_INFO=$(gh release view "$VERSION" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv'); then
            read -r IS_DRAFT TARGET_COMMIT <<< "$RELEASE_INFO"
            if [[ "$TARGET_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Release version already refers to a different commit." >&2
              exit 1
            fi
            if [[ "$IS_DRAFT" == 'false' ]]; then
              echo "Release already published; leaving its files unchanged."
              exit 0
            fi
          else
            gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
              --title "$VERSION" --notes "Linux amd64 binary with embedded web assets. Commit: $GITHUB_SHA"
          fi

          gh release upload "$VERSION" "dist/$BINARY" "dist/$BINARY.sha256" --clobber
          gh release edit "$VERSION" --draft=false --latest=false
